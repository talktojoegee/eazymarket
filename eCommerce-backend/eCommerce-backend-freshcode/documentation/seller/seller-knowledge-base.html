<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hypercommerce — Seller Knowledge Base</title>
  <link rel="icon" href="assets/hyper-favicon.png" />
  <link rel="stylesheet" href="hypercommerce-docs.css" />
  <link rel="stylesheet" href="kb.css" />
</head>
<body>
  <div class="doc-app">

    <!-- ============ Sidebar ============ -->
    <aside class="doc-sb">
      <div class="doc-sb-brand">
        <img class="doc-logo-img on-light" src="assets/hyper-logo-onlight.png" alt="Hypercommerce" />
        <img class="doc-logo-img on-dark" src="assets/hyper-logo-ondark.png" alt="Hypercommerce" />
        <span class="kb-role">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 5 4h14l1 5.5"/><path d="M4 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 4 0"/><path d="M5 11v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/></svg>
          <span data-i18n="roleBadge">Seller Guide</span>
        </span>
      </div>
      <div class="doc-sb-search" data-open-search>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <span class="ph" data-i18n="search">Search the seller guide…</span>
        <span class="kbd">⌘K</span>
      </div>
      <nav class="doc-sb-scroll" id="sidebarNav"></nav>
      <div class="doc-sb-foot">
        <span class="av">HC</span>
        <span class="who"><b>Hypercommerce</b><span data-i18n="siteLabel">Seller Knowledge Base</span></span>
      </div>
    </aside>
    <div class="doc-sb-backdrop" id="sbBackdrop" hidden></div>

    <!-- ============ Main ============ -->
    <div class="doc-main">
      <header class="doc-hdr">
        <button class="doc-iconbtn doc-mobile-btn" id="menuBtn" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="doc-crumbs">
          <span class="root doc-hide-sm" id="crumbRoot">Getting Started</span>
          <svg class="sep doc-hide-sm" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span class="cur" id="crumbCur">Getting Started</span>
        </div>
        <div class="doc-hdr-spacer"></div>
        <span class="doc-hdr-link doc-hide-md doc-support-link" data-i18n="support">Support</span>
        <select id="langSwitch" class="doc-lang" aria-label="Language" style="display:none"></select>
        <button class="doc-iconbtn" data-open-search aria-label="Search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </button>
        <button class="doc-iconbtn" id="themeToggle" aria-label="Toggle theme"></button>
      </header>

      <div class="doc-scroll">
        <div class="doc-layout">
          <article class="doc-article">
            <div id="pages">
              <!-- engine renders the active article here -->
              <section class="doc-page" data-page="__article" hidden></section>
            </div><!-- /#pages -->

            <!-- related articles (per-article) -->
            <div id="kbRelated"></div>

            <!-- shared feedback + prev/next -->
            <div class="doc-feedback">
              <span data-i18n="helpful">Was this article helpful?</span>
              <div class="fb-btns">
                <button class="doc-fb-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3Z"/><path d="M7 11l4-8a2 2 0 0 1 2 1.5V8h5a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 18.8 19H7"/></svg><span data-i18n="yes">Yes</span></button>
                <button class="doc-fb-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 13V4h3a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-3Z"/><path d="M17 13l-4 8a2 2 0 0 1-2-1.5V16H6a2 2 0 0 1-2-2.3l1.2-7A2 2 0 0 1 7.2 5H17"/></svg><span data-i18n="no">No</span></button>
              </div>
              <span class="doc-fb-done" data-i18n="thanks" style="display:none;color:var(--hc-accent-fg);font-weight:600">Thanks for the feedback.</span>
            </div>
            <nav class="doc-prevnext">
              <div class="doc-pn prev" id="pnPrev"></div>
              <div class="doc-pn next" id="pnNext"></div>
            </nav>
          </article>

          <!-- ============ On this page ============ -->
          <div class="doc-toc">
            <div class="doc-toc-h"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span data-i18n="onThisPage">On this page</span></div>
            <nav class="doc-toc-list" id="tocList"></nav>
            <div class="doc-toc-aux">
              <a class="doc-support-link" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="m5 5 3.5 3.5M15.5 15.5 19 19M19 5l-3.5 3.5M8.5 15.5 5 19"/></svg><span data-i18n="getSupport">Get support</span></a>
            </div>
          </div>

        </div><!-- /.doc-layout -->
      </div><!-- /.doc-scroll -->
    </div><!-- /.doc-main -->
  </div><!-- /.doc-app -->

  <!-- ============ Command palette ============ -->
  <div class="doc-cmd-scrim" id="palette" hidden>
    <div class="doc-cmd">
      <div class="doc-cmd-input">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:var(--tk-fg-5)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="paletteInput" data-i18n-ph="searchInput" placeholder="Search the seller guide…" />
        <span class="esc">ESC</span>
      </div>
      <div class="doc-cmd-list" id="paletteList"></div>
    </div>
  </div>

  <script src="config.js?v=3.3.0"></script>
  <script src="assets/lightbox/index.js"></script>
  <script src="kb-helpers.js"></script>
  <script src="kb-data-seller.js?v=3.3.0.7"></script>
  <script src="kb-data-seller.hi.js"></script>
  <script src="kb-data-seller.es.js"></script>
  <script src="kb-data-seller.fr.js"></script>
  <script src="kb-data-seller.de.js"></script>
  <script src="kb-data-seller.zh.js"></script>
  <script src="kb-engine.js?v=3.3.0.1"></script>
</body>
</html>
